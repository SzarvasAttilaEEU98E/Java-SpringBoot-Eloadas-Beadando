
<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>OANDA - Történelmi árfolyamok</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <h1 class="text-center mb-4">
        OANDA Forex - Történelmi árfolyamok
    </h1>

    <p class="text-center text-muted mb-5">
        Devizapárok történelmi árfolyamainak lekérdezése
        és grafikus megjelenítése.
    </p>

    <!-- Lekérdezési űrlap -->
    <div class="card shadow-sm mb-4">

        <div class="card-body">

            <h5 class="card-title mb-4">
                Lekérdezési beállítások
            </h5>

            <form id="historyForm">

                <div class="row g-3">

                    <!-- Devizapár -->
                    <div class="col-md-4">

                        <label for="devizapar"
                               class="form-label">
                            Devizapár
                        </label>

                        <select id="devizapar"
                                class="form-select"
                                required>

                            <option value="EUR_USD">
                                EUR/USD
                            </option>

                            <option value="GBP_USD">
                                GBP/USD
                            </option>

                            <option value="USD_JPY">
                                USD/JPY
                            </option>

                        </select>
                    </div>

                    <!-- Kezdő dátum -->
                    <div class="col-md-4">

                        <label for="kezdoDatum"
                               class="form-label">
                            Kezdő dátum
                        </label>

                        <input type="date"
                               id="kezdoDatum"
                               class="form-control"
                               required>
                    </div>

                    <!-- Végső dátum -->
                    <div class="col-md-4">

                        <label for="vegDatum"
                               class="form-label">
                            Végső dátum
                        </label>

                        <input type="date"
                               id="vegDatum"
                               class="form-control"
                               required>
                    </div>

                </div>

                <div class="mt-4">

                    <button type="submit"
                            class="btn btn-primary">
                        Árfolyamok lekérdezése
                    </button>

                </div>

            </form>

        </div>
    </div>

    <!-- Hibaüzenet -->
    <div id="hibaUzenet"
         class="alert alert-danger d-none"
         role="alert">
    </div>

    <!-- Grafikon -->
    <div class="card shadow-sm">

        <div class="card-body">

            <h5 class="card-title mb-4">
                Történelmi árfolyamgrafikon
            </h5>

            <div class="position-relative"
                 style="height: 400px;">

                <canvas id="historyChart"></canvas>

            </div>

        </div>
    </div>

    <!-- Visszalépés -->
    <div class="mt-4 text-center">

        <a href="/"
           class="btn btn-outline-secondary">
            Vissza a főoldalra
        </a>

    </div>

</div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>

<!-- Saját JavaScript -->
<script src="/js/forex-history.js"></script>

</body>
</html>

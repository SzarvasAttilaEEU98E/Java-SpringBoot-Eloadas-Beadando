
<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forex – Historikus árfolyamok</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            Deviza &amp; Forex
        </a>
        <a class="btn btn-outline-light"
           th:href="@{/}">
            Főoldal
        </a>
    </div>
</nav>

<main class="container py-5">

    <h1 class="mb-3">Forex – Historikus árfolyamok</h1>

    <p class="text-muted">
        Az OANDA API utolsó 10 historikus árfolyamának
        lekérdezése kiválasztott időfelbontással.
    </p>

    <div class="card shadow-sm mb-4">
        <div class="card-body">

            <form id="historyForm">

                <div class="row g-3">

                    <div class="col-md-6">
                        <label for="devizapar"
                               class="form-label">
                            Instrumentum
                        </label>

                        <select id="devizapar"
                                class="form-select"
                                required>
                            <option value="EUR_USD">EUR/USD</option>
                            <option value="GBP_USD">GBP/USD</option>
                            <option value="USD_JPY">USD/JPY</option>
                            <option value="EUR_GBP">EUR/GBP</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="granularity"
                               class="form-label">
                            Granularity
                        </label>

                        <select id="granularity"
                                class="form-select"
                                required>
                            <option value="M15">15 perc</option>
                            <option value="H1">1 óra</option>
                            <option value="H4">4 óra</option>
                            <option value="D" selected>Napi</option>
                            <option value="W">Heti</option>
                        </select>
                    </div>

                    <div class="col-12">
                        <button type="submit"
                                class="btn btn-primary"
                                id="lekerdezesGomb">
                            Utolsó 10 ár lekérdezése
                        </button>
                    </div>

                </div>
            </form>

            <div id="hibaUzenet"
                 class="alert alert-danger mt-3 d-none"
                 role="alert">
            </div>

        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h2 class="h5 mb-3">Historikus árfolyamok grafikonja</h2>
            <canvas id="historyChart"></canvas>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <h2 class="h5 mb-3">
                Utolsó 10 historikus ár
            </h2>

            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead>
                    <tr>
                        <th>Időpont</th>
                        <th>Nyitóár</th>
                        <th>Maximum</th>
                        <th>Minimum</th>
                        <th>Záróár</th>
                    </tr>
                    </thead>

                    <tbody id="historyTabla">
                    <tr>
                        <td colspan="5" class="text-center">
                            Még nincs lekérdezett adat.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script th:src="@{/js/forex-history.js}"
        src="/js/forex-history.js"></script>

</body>
</html>

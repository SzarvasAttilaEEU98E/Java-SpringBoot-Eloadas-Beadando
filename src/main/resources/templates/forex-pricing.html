
<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>OANDA Forex árfolyamok</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

</head>

<body>

<div class="container mt-5">

    <h1>OANDA Forex árfolyamok</h1>

    <p class="text-muted">
        Aktuális devizaárfolyamok lekérdezése az OANDA REST API segítségével
    </p>

    <div class="card mt-4">

        <div class="card-header">
            Devizapárok árfolyamai
        </div>

        <div class="card-body">

            <div id="hibaUzenet"
                 class="alert alert-danger d-none"
                 role="alert">
            </div>

            <div class="table-responsive">

                <table class="table table-striped table-hover">

                    <thead>
                    <tr>
                        <th>Devizapár</th>
                        <th>Bid</th>
                        <th>Ask</th>
                        <th>Időpont</th>
                        <th>Állapot</th>
                        <th>Kereskedhető</th>
                    </tr>
                    </thead>

                    <tbody id="arfolyamTabla">

                    <tr>
                        <td colspan="6" class="text-center">
                            Árfolyamok betöltése...
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<!-- OANDA Forex árfolyamok JavaScript -->
<script src="/js/forex-pricing.js"></script>

</body>
</html>

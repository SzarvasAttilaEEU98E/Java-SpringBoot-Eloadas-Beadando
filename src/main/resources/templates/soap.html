
<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MNB SOAP árfolyamlekérdezés</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>

<div class="container mt-5">

    <!-- Oldal címe -->
    <h1>MNB SOAP árfolyamlekérdezés</h1>

    <p class="text-muted">
        Magyar Nemzeti Bank hivatalos devizaárfolyamai
    </p>

    <!-- Árfolyamlekérdezés űrlap -->
    <form id="arfolyamForm" class="row g-3 mt-3">

        <!-- Devizaválasztó -->
        <div class="col-md-4">

            <label for="deviza" class="form-label">
                Deviza
            </label>

            <select id="deviza" class="form-select" required>

                <option value="EUR">EUR - Euró</option>
                <option value="USD">USD - Amerikai dollár</option>
                <option value="GBP">GBP - Angol font</option>
                <option value="CHF">CHF - Svájci frank</option>

            </select>

        </div>

        <!-- Kezdődátum -->
        <div class="col-md-4">

            <label for="kezdoDatum" class="form-label">
                Kezdődátum
            </label>

            <input type="date"
                   id="kezdoDatum"
                   class="form-control"
                   value="2026-10-01"
                   required>

        </div>

        <!-- Végdátum -->
        <div class="col-md-4">

            <label for="vegDatum" class="form-label">
                Végdátum
            </label>

            <input type="date"
                   id="vegDatum"
                   class="form-control"
                   value="2026-10-16"
                   required>

        </div>

        <!-- Lekérdezés gomb -->
        <div class="col-12">

            <button type="submit" class="btn btn-primary">
                Árfolyamok lekérdezése
            </button>

        </div>

    </form>


    <!-- Árfolyamok táblázata -->
    <div class="mt-5">

        <h2>Lekérdezett árfolyamok</h2>

        <!-- Hibaüzenet -->
        <div id="hibaUzenet"
             class="alert alert-danger d-none"
             role="alert">
        </div>

        <!-- Reszponzív táblázat -->
        <div class="table-responsive">

            <table class="table table-striped table-hover">

                <thead class="table-dark">
                <tr>
                    <th>Dátum</th>
                    <th>Deviza</th>
                    <th>Árfolyam (HUF)</th>
                </tr>
                </thead>

                <tbody id="arfolyamTabla">
                </tbody>

            </table>

        </div>

    </div>


    <!-- Árfolyamgrafikon -->
    <div class="mt-5 mb-5">

        <h2>Árfolyamváltozás grafikon</h2>

        <div class="card shadow-sm">

            <div class="card-body">

                <canvas id="arfolyamGrafikon"></canvas>

            </div>

        </div>

    </div>

</div>


<!-- Chart.js grafikonkönyvtár -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>

<!-- Saját JavaScript -->
<script src="/js/mnb-soap.js"></script>

</body>
</html>

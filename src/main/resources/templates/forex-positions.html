
<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nyitott Forex pozíciók</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >
</head>
<body class="bg-light">

<div class="container py-5">

    <h1 class="mb-3">Nyitott Forex pozíciók</h1>

    <p class="text-muted">
        Az OANDA gyakorló számlán jelenleg nyitott
        Forex pozíciók megtekintése.
    </p>

    <div class="card shadow-sm">
        <div class="card-body">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="card-title mb-0">
                    Pozíciók listája
                </h5>

                <button
                        id="frissitesButton"
                        type="button"
                        class="btn btn-primary">
                    Frissítés
                </button>
            </div>

            <div id="hibaUzenet"
                 class="alert alert-danger d-none"
                 role="alert">
            </div>

            <div id="uresLista"
                 class="alert alert-info d-none"
                 role="status">
                Jelenleg nincs nyitott Forex pozíció.
            </div>

            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>Devizapár</th>
                        <th>Long egység</th>
                        <th>Short egység</th>
                        <th>Long eredmény</th>
                        <th>Short eredmény</th>
                        <th>Összes eredmény</th>
                    </tr>
                    </thead>

                    <tbody id="poziciokTabla">
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <div class="mt-4">
        <a href="/forex/order/page" class="btn btn-outline-primary">
            Long / Short megbízások
        </a>
    </div>

</div>

<script src="/js/forex-positions.js"></script>

</body>
</html>
